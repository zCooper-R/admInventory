<div class="modal fade" id="pcDeleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Удалить устройство</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Удалить устройство <strong>{{ pc.inventory_number }}</strong>?</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
        <form method="post" hx-post="{% url 'pc-delete-modal' pc.pk %}" hx-target="#modal-container" hx-swap="innerHTML">
          {% csrf_token %}
          <button class="btn btn-danger" type="submit">Удалить</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
(function(){var el=document.getElementById('pcDeleteModal');if(el) bootstrap.Modal.getOrCreateInstance(el).show();})();
</script>
