<div class="modal fade" id="pcModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title }}</h5>
        <button type="button" class="btn-close" id="modalCloseBtn" aria-label="Закрыть"></button>
      </div>

      <form method="post" hx-post="{{ action_url }}" hx-target="#modal-container" hx-swap="innerHTML">
        {% csrf_token %}
        <div class="modal-body">
          <div class="row g-3">
            {% for field in form %}
              <div class="col-md-4">
                <label class="form-label">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors|join:", " }}</div>{% endif %}
              </div>
            {% endfor %}
          </div>
          {% if form.non_field_errors %}<div class="alert alert-danger mt-3">{{ form.non_field_errors|join:" " }}</div>{% endif %}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" id="modalCancelBtn">Отмена</button>
          <button type="submit" class="btn btn-primary">{% if is_create %}Создать{% else %}Сохранить{% endif %}</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
(function () {
  var el = document.getElementById('pcModal');
  if (el) bootstrap.Modal.getOrCreateInstance(el).show();
  function closeModal() {
    var m = document.getElementById('pcModal');
    if (m) bootstrap.Modal.getInstance(m)?.hide();
  }
  document.getElementById('modalCloseBtn')?.addEventListener('click', closeModal);
  document.getElementById('modalCancelBtn')?.addEventListener('click', closeModal);
}());
</script>
