{% extends 'base.html' %}

{% block title %}Удалить устройство{% endblock %}

{% block content %}
<div class="card card-body">
  <h1 class="h5">Удаление устройства</h1>
  <p>Инвентарный номер: <strong>{{ pc.inventory_number }}</strong></p>
  <p>Организация: <strong>{{ pc.organization.name }}</strong></p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a class="btn btn-outline-secondary" href="{% url 'pc-list' %}">Отмена</a>
  </form>
</div>
{% endblock %}
