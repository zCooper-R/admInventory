{% extends 'base.html' %}

{% block title %}{{ title }} — IT Инвентарь{% endblock %}

{% block content %}
<div class="card card-body">
  <h1 class="h4 mb-3">{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    <div class="row g-3">
      {% for field in form %}
        <div class="col-md-4">
          <label class="form-label">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors|join:", " }}</div>{% endif %}
        </div>
      {% endfor %}
    </div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary" type="submit">Сохранить</button>
      <a class="btn btn-outline-secondary" href="{% url 'pc-list' %}">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
