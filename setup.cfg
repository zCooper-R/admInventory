[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    migrations,
    staticfiles,
    backend/fixtures/create_sample_excel.py

per-file-ignores =
    # star-imports are expected in settings files
    backend/config/settings/*.py: F401,F403,F405
    # test factories use short variable names
    backend/tests/factories.py: N803

[isort]
profile = black
line_length = 100
skip = migrations, venv, .venv

[tool:pytest]
# pytest config lives in backend/pytest.ini; this section is a placeholder
# so that `isort` and other tools pick up the project root correctly.
